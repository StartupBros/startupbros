name: kissing5-deterministic-step-collision

on:
  push:
    branches:
      - kissing5-relay-20260814
    paths:
      - .github/workflows/kissing5-deterministic-step-collision.yml
      - research/patch_kissing5_deterministic_step.py
      - research/kissing5_deterministic_step_collision.jl
  workflow_dispatch:

jobs:
  deterministic-step-collision:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'

      - name: Clone, patch, and instantiate fixed solver
        run: |
          set -euxo pipefail
          git clone https://github.com/nanleij/ClusteredLowRankSolver.jl.git clrs
          git -C clrs checkout 09ac81aed031bdea714832cf515244f6eb223531
          python3 research/patch_kissing5_deterministic_step.py
          git -C clrs diff -- src/solver.jl | tee deterministic_step.patch
          julia --project=clrs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Run deterministic step collision
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('research/kissing5_deterministic_step_collision.jl')
          text = p.read_text()
          old = '@assert Set(keys(p1.freevars)) == Set(keys(p2.freevars)'
          assert text.count(old) == 1, text.count(old)
          p.write_text(text.replace(old, old + ')', 1))
          PY
          mkdir -p results
          cp deterministic_step.patch results/
          cp research/patch_kissing5_deterministic_step.py results/
          cp research/kissing5_deterministic_step_collision.jl results/
          cp .github/workflows/kissing5-deterministic-step-collision.yml results/workflow.yml
          julia --project=clrs research/kissing5_deterministic_step_collision.jl > results/solve.log 2>&1
          grep -q DETERMINISTIC_STEP_COLLISION_COMPLETE results/solve.log
          sha256sum results/* > results/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kissing5-deterministic-step-collision
          path: results/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
