name: perfect-cuboid-22-1-lvalue
on:
  push:
    branches: [math/perfect-cuboid-22-1-square-quotient]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp pari-elldata
      - name: Generate exact Dirichlet coefficients
        run: |
          set -euo pipefail
          mkdir -p results
          cat > /tmp/gen.gp <<'GP'
          E=ellinit([0,-1,0,-392828227008,82656349920870012]);
          a=ellan(E,500000);
          write("results/an.gpvec",a);
          print("LEN=",#a);
          print("ROOTNO=",ellrootno(E));
          print("GLOBALRED=",ellglobalred(E));
          quit;
          GP
          GP_COLORS='' gp -q -s 500000000 /tmp/gen.gp > results/pari.txt 2>&1
          cat results/pari.txt
          grep -q '^LEN=500000$' results/pari.txt
          grep -q '^ROOTNO=1$' results/pari.txt
      - name: Directed central-value interval
        run: |
          set -euo pipefail
          cat > /tmp/interval.py <<'PY'
          import ast, math, hashlib
          from decimal import Decimal, Context, localcontext, ROUND_FLOOR, ROUND_CEILING
          from fractions import Fraction
          from pathlib import Path
          M=500000
          N=45248695800
          p=Path('results/an.gpvec')
          coeffs=ast.literal_eval(p.read_text())
          assert len(coeffs)==M
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          pi_s='3.141592653589793238462643383279502884197169399375105820974944592307816406286208998628034825342117067982148086513282306647093844609550582231725359408128'
          S10=10**150
          pi_lo=Fraction(int(pi_s.replace('.','')),S10)
          pi_hi=pi_lo+Fraction(1,S10)
          S=10**170
          sf=math.isqrt(N*S*S)
          sqrt_lo=Fraction(sf,S)
          sqrt_hi=Fraction(sf+1,S)
          alpha_lo=2*pi_lo/sqrt_hi
          alpha_hi=2*pi_hi/sqrt_lo
          def alt_sum(x,n):
              term=Fraction(1); total=term
              for j in range(1,n+1):
                  term*=-x/Fraction(j); total+=term
              return total
          ratio_lo_q=alt_sum(alpha_hi,15)
          ratio_hi_q=alt_sum(alpha_lo,14)
          P=150
          def cv(fr,rd):
              with localcontext(Context(prec=P,rounding=rd)):
                  return Decimal(fr.numerator)/Decimal(fr.denominator)
          ratio_lo=cv(ratio_lo_q,ROUND_FLOOR)
          ratio_hi=cv(ratio_hi_q,ROUND_CEILING)
          down=Context(prec=P,rounding=ROUND_FLOOR)
          up=Context(prec=P,rounding=ROUND_CEILING)
          pow_lo=pow_hi=Decimal(1)
          sum_lo=sum_hi=Decimal(0)
          for n,a in enumerate(coeffs,1):
              pow_lo=down.multiply(pow_lo,ratio_lo)
              pow_hi=up.multiply(pow_hi,ratio_hi)
              aa=Decimal(a); nn=Decimal(n)
              if a>=0:
                  tlo=down.divide(down.multiply(aa,pow_lo),nn)
                  thi=up.divide(up.multiply(aa,pow_hi),nn)
              else:
                  tlo=down.divide(down.multiply(aa,pow_hi),nn)
                  thi=up.divide(up.multiply(aa,pow_lo),nn)
              sum_lo=down.add(sum_lo,tlo)
              sum_hi=up.add(sum_hi,thi)
          tail=up.divide(up.multiply(Decimal(4),up.multiply(pow_hi,ratio_hi)),down.subtract(Decimal(1),ratio_hi))
          Llo=down.subtract(down.multiply(Decimal(2),sum_lo),tail)
          Lhi=up.add(up.multiply(Decimal(2),sum_hi),tail)
          assert Llo>0
          out='\n'.join([
              f'COEFF_SHA256={sha}',f'M={M}',f'N={N}',
              f'ALPHA_LO={cv(alpha_lo,ROUND_FLOOR)}',f'ALPHA_HI={cv(alpha_hi,ROUND_CEILING)}',
              f'PARTIAL_LO={down.multiply(Decimal(2),sum_lo)}',f'PARTIAL_HI={up.multiply(Decimal(2),sum_hi)}',
              f'TAIL_UPPER={tail}',f'L_LOWER={Llo}',f'L_UPPER={Lhi}',f'POSITIVE={Llo>0}'
          ])+'\n'
          Path('results/interval.txt').write_text(out)
          print(out,end='')
          PY
          python3 /tmp/interval.py
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-cuboid-22-1-lvalue
          path: results/
          if-no-files-found: error
