name: perfect-cuboid-bielliptic-ranks

on:
  push:
    branches:
      - math/perfect-cuboid-bielliptic-ranks

jobs:
  exact-bielliptic-ranks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install eclib
        run: |
          sudo apt-get update
          sudo apt-get install -y eclib-tools
      - name: Run four exact descents and fail closed
        shell: bash
        run: |
          set -euo pipefail
          OUT=results
          mkdir -p "$OUT"
          run_one() {
            label="$1"; ainvs="$2"
            printf '%s\n' "$ainvs" | mwrank -q -v 1 -l -o -p 100 -b 30 -S -1 > "$OUT/$label.txt" 2>&1
            cat "$OUT/$label.txt"
            ! grep -qiE 'error|failed|The rank has not been completely determined|only a lower bound' "$OUT/$label.txt"
            grep -Eq 'Rank = [0-9]+|rank\(E\) = [0-9]+' "$OUT/$label.txt"
            grep -q 'The rank and full Mordell-Weil basis have been determined unconditionally.' "$OUT/$label.txt"
          }
          run_one E5P  '[0,804005,0,161362572000,0]'
          run_one E5M  '[0,31205,0,-161362572000,0]'
          run_one E10P '[0,1608010,0,645450288000,0]'
          run_one E10M '[0,62410,0,-645450288000,0]'
          for f in E5P E5M E10P E10M; do
            rank=$(grep -E 'Rank = [0-9]+|rank\(E\) = [0-9]+' "$OUT/$f.txt" | tail -1)
            basis=$(grep -E '^\[\[[0-9]+\],' "$OUT/$f.txt" | tail -1 || true)
            printf '%s %s %s\n' "$f" "$rank" "$basis"
          done | tee "$OUT/RESULT.txt"
      - name: Hash results
        run: sha256sum results/* | tee results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-cuboid-bielliptic-ranks
          path: results/
          if-no-files-found: error
