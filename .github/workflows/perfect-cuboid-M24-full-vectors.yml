name: perfect-cuboid-M24-full-vectors

on:
  push:
    branches: [math/perfect-cuboid-23-22-two-cover]
    paths: [.github/workflows/perfect-cuboid-M24-full-vectors.yml]
  workflow_dispatch:

jobs:
  vector:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        n: [1,5,7,11,13,17,19,23]
    steps:
      - uses: actions/checkout@v4
      - name: Exact full six-rank vector
        env:
          NN: ${{ matrix.n }}
        run: |
          set -euo pipefail
          mkdir -p results
          cat > /tmp/vector.py <<'PY'
          import html, os, re, requests, time
          N=int(os.environ['NN']); M=24
          code=f'''
          SetColumns(0);
          function C(M,N,i)
            a:=M^2-N^2; b:=2*M*N; q:=a^2*b^2;
            if i eq 1 then return EllipticCurve([0,a^2-b^2,0,-q,0]);
            elif i eq 2 then return EllipticCurve([0,b^2-a^2,0,-q,0]);
            elif i eq 3 then return EllipticCurve([0,a^4+b^4,0,a^4*b^4,0]);
            elif i eq 4 then return EllipticCurve([0,a^2+b^2,0,q,0]);
            elif i eq 5 then return EllipticCurve([0,-a^2-b^2,0,q,0]);
            else return EllipticCurve([0,30*a*b+5*(a+b)^2,0,200*q+150*a*b*(a+b)^2,1000*q*(a+b)^2]); end if;
          end function;
          V:=[]; for i in [1..6] do l,u:=RankBounds(C({M},{N},i)); Append(~V,<l,u>); end for;
          print "VECTOR",{M},{N},V;
          '''
          last=None
          for attempt in range(1,7):
              try:
                  r=requests.post('https://magma.maths.usyd.edu.au/xml/calculator.xml',data={'input':code},timeout=89)
                  last=(r.status_code,r.text)
                  if r.status_code==200 and '<offline>' not in r.text and '<warning>' not in r.text: break
              except Exception as e: last=('EXC',repr(e))
              time.sleep(8*attempt)
          if not last or last[0]!=200: raise SystemExit(f'calculator failed: {last!r}')
          text=last[1]; open('results/raw.xml','w').write(text)
          lines=[html.unescape(x) for x in re.findall(r'<line>(.*?)</line>',text,flags=re.S)]
          out='\n'.join(lines).strip()+'\n'; open('results/output.txt','w').write(out); print(out)
          if 'Runtime error' in out or '>>' in out or 'VECTOR 24' not in out: raise SystemExit('Magma error')
          PY
          python3 /tmp/vector.py
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-cuboid-M24-N-${{ matrix.n }}
          path: results/
          if-no-files-found: error
