name: perfect-cuboid-rank1-three-sieve-v2
on:
  push:
    branches: [math/perfect-cuboid-rank1-three-sieve]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Independent exact projective sieve
        run: |
          set -euo pipefail
          mkdir -p results
          cat > /tmp/check.py <<'PY'
          from fractions import Fraction
          import json
          A=1194439680000;B=239738147958629376000000;C=286352756731497925108039680000000000
          BM=548667061240312000;S=328460543600;R=518420;D=772800;AL=417605
          data={
          21:(29,(Fraction(-16010184974368139760920000,2385951938286849),Fraction(633336090237001674628066043534168000000,116544702269610651631743)),{3,19,47,18233}),
          69:(11,(Fraction(-3991272005600097129783320000,748752499009009881),Fraction(629386852906773591696542428768782296000000,647899175580888934808311779)),{3,19,2837,5351}),
          230:(877,(Fraction(36229200350600645245170526746752409600,1300383078273981786647956969),Fraction(238214434186066586432503063289592290083070069515207680000,46892886232628756649763956826299373160203)),{19,29,521,3583,35059})}
          bad={2,3,5,7,17,23,79,401}
          def mq(q,p):return q.numerator%p*pow(q.denominator%p,-1,p)%p
          def add(P,Q,p,a2,a4):
            if P is None:return Q
            if Q is None:return P
            x,y=P;u,v=Q
            if x==u and (y+v)%p==0:return None
            l=((3*x*x+2*a2*x+a4)*pow(2*y%p,-1,p) if P==Q else (v-y)*pow((u-x)%p,-1,p))%p
            X=(l*l-a2-x-u)%p
            return X,(l*(x-X)-y)%p
          def subgroup(P,T,p,a2,a4):
            cyc=[];seen=set();Q=None
            while Q not in seen:seen.add(Q);cyc.append(Q);Q=add(Q,P,p,a2,a4)
            return set(cyc)|{add(Q,T,p,a2,a4) for Q in cyc},len(cyc)
          def image(d,p):
            iv=pow(d%p,-1,p);k=D*iv%p;root=R*iv%p;shift=S*iv%p;dm=BM*pow(d*d%p,-1,p)%p
            sq={}
            for y in range(p):sq.setdefault(y*y%p,[]).append(y)
            I=set();aff=0
            for m in range(p):
              m2=m*m%p;m4=m2*m2%p;rhs=(m4+k*k)%p*(d*(m4+k*k)+4*AL*m2)%p
              for v in sq.get(rhs,[]):
                aff+=1;u=(m2+root)%p
                I.add(None if u==0 else ((dm*pow(u,-1,p)-shift)%p,dm*v*pow(u*u%p,-1,p)%p))
            inf=[]
            for sd in sq.get(d%p,[]):q=((-shift)%p,dm*sd%p);inf.append(q);I.add(q)
            return I,aff,inf
          def primes(n):
            return [q for q in range(2,n+1) if all(q%r for r in range(2,int(q**.5)+1))]
          out={}
          for d,(p,P,denbad) in data.items():
            a2=A//d;a4=B//d**2;a6=C//d**3
            assert P[1]**2==P[0]**3+a2*P[0]**2+a4*P[0]+a6
            H,o=subgroup((mq(P[0],p),mq(P[1],p)),(-a2%p,0),p,a2%p,a4%p)
            I,aff,inf=image(d,p);assert H.isdisjoint(I)
            first=None
            for q in primes(p):
              if q in bad or d%q==0 or q in denbad:continue
              Hq,_=subgroup((mq(P[0],q),mq(P[1],q)),(-a2%q,0),q,a2%q,a4%q)
              Iq,_,_=image(d,q)
              if Hq.isdisjoint(Iq):first=q;break
            assert first==p
            out[d]={"p":p,"H":sorted(["O" if x is None else list(x) for x in H],key=str),"ordP":o,"affine":aff,"infinity":inf,"image_size":len(I),"first":first}
          print(json.dumps(out,sort_keys=True,indent=2))
          open("results/certificate.json","w").write(json.dumps(out,sort_keys=True,indent=2))
          PY
          python3 /tmp/check.py | tee results/python.txt
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rank1-three-sieve-v2
          path: results/
          if-no-files-found: error
