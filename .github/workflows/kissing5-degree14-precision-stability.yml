name: kissing5-degree14-precision-stability

on:
  push:
    branches:
      - kissing5-relay-20260814
    paths:
      - .github/workflows/kissing5-degree14-precision-stability.yml
  workflow_dispatch:

jobs:
  run-case:
    name: degree14-${{ matrix.prec }}bit-3iter
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - prec: 192
            case: p192
          - prec: 224
            case: p224
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Clone fixed solver commit
        run: |
          set -euxo pipefail
          git clone https://github.com/nanleij/ClusteredLowRankSolver.jl.git clrs
          git -C clrs checkout 09ac81aed031bdea714832cf515244f6eb223531
          julia --project=clrs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run three completed iterations with all checkpoints retained
        env:
          CASE: ${{ matrix.case }}
          PREC: ${{ matrix.prec }}
          JULIA_NUM_THREADS: '1'
        run: |
          set +e
          mkdir -p "results/${CASE}"
          timeout 165m julia --project=clrs <<'JULIA' 2>&1 | tee "results/${CASE}/solve.log"
          using Serialization
          include("clrs/examples/ThreePointBound.jl")
          using .ThreePointBound, ClusteredLowRankSolver
          case=ENV["CASE"]
          prec=parse(Int,ENV["PREC"])
          root="results/$(case)"
          ledger="$(root)/iterates.tsv"
          open(ledger,"w") do io
              println(io,"iter\ttime\tmu\td_obj\tp_obj\tdual_gap\tD_error\td_error\tp_error\talpha_d\talpha_p")
          end
          cb=function(m)
              open(ledger,"a") do io
                  vals=(m.iter,m.time,m.mu,m.d_obj,m.p_obj,m.dual_gap,m.D_error,m.d_error,m.p_error,m.alpha_d,m.alpha_p)
                  println(io,join(string.(vals),'\t'))
              end
          end
          ss=SaveSettings(iter_interval=1,only_last=false,save_name="$(root)/checkpoint_#")
          problem,dualsol,primalsol=three_point_spherical_codes(
              5,1//2,14,14;
              prec=prec,
              matmul_prec=prec,
              preprocess=false,
              maxiterations=3,
              duality_gap_threshold=big"1e-100",
              dual_error_threshold=big"1e-100",
              primal_error_threshold=big"1e-100",
              omega_d=10^3,
              omega_p=10^3,
              step_length_threshold=big"1e-35",
              save_settings=ss,
              iteration_callback=cb)
          serialize("$(root)/returned.jls",(dualsol,primalsol))
          println("RETURNED_PRIMAL_OBJECTIVE=",objvalue(problem,primalsol))
          println("RETURNED_DUAL_OBJECTIVE=",dualobjvalue(problem,dualsol))
          JULIA
          echo ${PIPESTATUS[0]} > "results/${CASE}/solver_exit_status.txt"
          exit 0
      - name: Fail closed and summarize all retained iterates
        env:
          CASE: ${{ matrix.case }}
          PREC: ${{ matrix.prec }}
        run: |
          set -euxo pipefail
          for k in 1 2 3; do test -s "results/${CASE}/checkpoint_${k}.jls"; done
          julia --project=clrs <<'JULIA' 2>&1 | tee "results/$(ENV["CASE"])/validation.log"
          using Serialization, SHA, LinearAlgebra
          using ClusteredLowRankSolver
          case=ENV["CASE"]
          root="results/$(case)"
          rows=max(0,countlines("$(root)/iterates.tsv")-1)
          @assert rows==3
          function maxdev(sol)
              z=BigFloat(0); entries=0
              for M0 in values(sol.matrixvars)
                  M=Matrix(M0)
                  for i in axes(M,1),j in axes(M,2)
                      target=(i==j ? BigFloat(1000) : BigFloat(0))
                      z=max(z,abs(BigFloat(M[i,j])-target)); entries+=1
                  end
              end
              z,entries
          end
          function maxdiff(a,b)
              @assert Set(keys(a.matrixvars))==Set(keys(b.matrixvars))
              z=BigFloat(0); n=0
              for key in keys(a.matrixvars)
                  A=Matrix(a.matrixvars[key]); B=Matrix(b.matrixvars[key]); @assert size(A)==size(B)
                  for i in eachindex(A)
                      z=max(z,abs(BigFloat(A[i])-BigFloat(B[i]))); n+=1
                  end
              end
              z,n
          end
          states=[]
          for k in 1:3
              d,p=deserialize("$(root)/checkpoint_$(k).jls")
              dd,de=maxdev(d); pd,pe=maxdev(p)
              @assert dd>0 && pd>0
              push!(states,(d,p,dd,pd,de,pe))
          end
          d12,n12d=maxdiff(states[1][1],states[2][1]); p12,n12p=maxdiff(states[1][2],states[2][2])
          d23,n23d=maxdiff(states[2][1],states[3][1]); p23,n23p=maxdiff(states[2][2],states[3][2])
          @assert d12>0 && p12>0 && d23>0 && p23>0
          open("$(root)/summary.tsv","w") do io
              println(io,"status\tPASS")
              println(io,"precision\t",ENV["PREC"])
              println(io,"completed_rows\t",rows)
              for k in 1:3
                  println(io,"checkpoint_$(k)_sha256\t",bytes2hex(sha256(read("$(root)/checkpoint_$(k).jls"))))
                  println(io,"checkpoint_$(k)_dual_maxdev\t",states[k][3])
                  println(io,"checkpoint_$(k)_primal_maxdev\t",states[k][4])
                  println(io,"checkpoint_$(k)_dual_entries\t",states[k][5])
                  println(io,"checkpoint_$(k)_primal_entries\t",states[k][6])
              end
              println(io,"dual_maxdiff_1_to_2\t",d12)
              println(io,"primal_maxdiff_1_to_2\t",p12)
              println(io,"dual_maxdiff_2_to_3\t",d23)
              println(io,"primal_maxdiff_2_to_3\t",p23)
              println(io,"compared_dual_entries_2_to_3\t",n23d)
              println(io,"compared_primal_entries_2_to_3\t",n23p)
          end
          println(read("$(root)/summary.tsv",String))
          JULIA
          sha256sum "results/${CASE}"/* > "results/${CASE}/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kissing5-degree14-${{ matrix.case }}-3iter
          path: results/${{ matrix.case }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  audit:
    name: independent-precision-and-replay-audit
    needs: run-case
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Clone fixed solver commit
        run: |
          set -euxo pipefail
          git clone https://github.com/nanleij/ClusteredLowRankSolver.jl.git clrs
          git -C clrs checkout 09ac81aed031bdea714832cf515244f6eb223531
          julia --project=clrs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - uses: actions/download-artifact@v4
        with:
          name: kissing5-degree14-p192-3iter
          path: inputs/new192
      - uses: actions/download-artifact@v4
        with:
          name: kissing5-degree14-p224-3iter
          path: inputs/new224
      - uses: actions/download-artifact@v4
        with:
          name: kissing5-degree14-192N
          path: inputs/old192
          repository: StartupBros/startupbros
          run-id: 31872356942
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare replayed second iterate and precision-perturbed third iterate
        run: |
          set -euxo pipefail
          mkdir -p results
          cat > audit.jl <<'JULIA'
          using Serialization, SHA
          using ClusteredLowRankSolver
          function maxdiff(a,b)
              @assert Set(keys(a.matrixvars))==Set(keys(b.matrixvars))
              z=BigFloat(0); n=0
              for key in keys(a.matrixvars)
                  A=Matrix(a.matrixvars[key]); B=Matrix(b.matrixvars[key]); @assert size(A)==size(B)
                  for i in eachindex(A)
                      z=max(z,abs(BigFloat(A[i])-BigFloat(B[i]))); n+=1
                  end
              end
              z,n
          end
          oldd,oldp=deserialize("inputs/old192/checkpoint.jls")
          n2d,n2p=deserialize("inputs/new192/checkpoint_2.jls")
          n3d,n3p=deserialize("inputs/new192/checkpoint_3.jls")
          h3d,h3p=deserialize("inputs/new224/checkpoint_3.jls")
          replay_d,nd=maxdiff(oldd,n2d); replay_p,np=maxdiff(oldp,n2p)
          prec_d,nd2=maxdiff(n3d,h3d); prec_p,np2=maxdiff(n3p,h3p)
          oldrows=readlines("inputs/old192/iterates.tsv")[2:end]
          newrows=readlines("inputs/new192/iterates.tsv")[2:end]
          function striptime(row)
              f=split(row,'\t'); deleteat!(f,2); join(f,'\t')
          end
          ledger_replay=(length(oldrows)>=2 && length(newrows)>=2 && striptime(oldrows[1])==striptime(newrows[1]) && striptime(oldrows[2])==striptime(newrows[2]))
          @assert replay_d==0 && replay_p==0
          @assert ledger_replay
          @assert prec_d>0 && prec_p>0
          open("results/audit.tsv","w") do io
              println(io,"status\tPASS")
              println(io,"old192_checkpoint_sha256\t",bytes2hex(sha256(read("inputs/old192/checkpoint.jls"))))
              println(io,"new192_checkpoint2_sha256\t",bytes2hex(sha256(read("inputs/new192/checkpoint_2.jls"))))
              println(io,"replay_dual_maxdiff\t",replay_d)
              println(io,"replay_primal_maxdiff\t",replay_p)
              println(io,"replay_compared_dual_entries\t",nd)
              println(io,"replay_compared_primal_entries\t",np)
              println(io,"first_two_ledger_rows_replay_without_time\t",ledger_replay)
              println(io,"third_iter_192_vs_224_dual_maxdiff\t",prec_d)
              println(io,"third_iter_192_vs_224_primal_maxdiff\t",prec_p)
              println(io,"third_iter_compared_dual_entries\t",nd2)
              println(io,"third_iter_compared_primal_entries\t",np2)
          end
          println(read("results/audit.tsv",String))
          JULIA
          julia --project=clrs audit.jl | tee results/audit.log
          grep -q $'status\tPASS' results/audit.tsv
          # Adversarial control: one-bit truncation must be rejected by deserializer.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inputs/new192/checkpoint_3.jls')
          b=p.read_bytes()
          Path('results/truncated_checkpoint.jls').write_bytes(b[:-1])
          PY
          set +e
          julia --project=clrs -e 'using Serialization,ClusteredLowRankSolver; deserialize("results/truncated_checkpoint.jls")' > results/truncation.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          echo "$rc" > results/truncation_exit_status.txt
          sha256sum results/* > results/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kissing5-degree14-precision-stability-audit
          path: results/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
