name: perfect-cuboid-25-14-rank1

on:
  push:
    paths:
      - '.github/workflows/perfect-cuboid-25-14-rank1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install exact arithmetic tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp pari-elldata eclib-tools
      - name: Independent descent, parity data, and Heegner reconstruction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          MODEL='0,273971089681,0,8132448632408100000000,0'
          echo "[$MODEL]" | mwrank -v 1 -p 1000 > results/mwrank.txt 2>&1 || true
          cat results/mwrank.txt
          cat > /tmp/check.gp <<'GP'
          default(parisizemax,8000000000);
          E=ellinit([0,273971089681,0,8132448632408100000000,0]);
          print("GLOBALRED=",ellglobalred(E));
          print("ROOTNO=",ellrootno(E));
          print("ANALYTIC=",ellanalyticrank(E));
          print("RANK=",ellrank(E,1));
          print("TORSION=",elltors(E));
          P=ellheegnertwist(E);
          print("POINT=",P);
          print("ONCURVE=",ellisoncurve(E,P));
          print("ORDER=",ellorder(E,P));
          print("HEIGHT=",ellheight(E,P));
          quit;
          GP
          GP_COLORS='' gp -q -s 2000000000 /tmp/check.gp > results/pari.txt 2>&1
          cat results/pari.txt
          grep -q '^ROOTNO=-1$' results/pari.txt
          grep -q '^ONCURVE=1$' results/pari.txt
          grep -q '^ORDER=0$' results/pari.txt
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-cuboid-25-14-rank1
          path: results/
          if-no-files-found: error
