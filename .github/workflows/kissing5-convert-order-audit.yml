name: kissing5-convert-order-audit

on:
  push:
    branches:
      - kissing5-relay-20260814
    paths:
      - .github/workflows/kissing5-convert-order-audit.yml
  workflow_dispatch:

jobs:
  conversion-order-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JULIA_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Clone fixed solver
        run: |
          set -euxo pipefail
          git clone https://github.com/nanleij/ClusteredLowRankSolver.jl.git clrs
          git -C clrs checkout 09ac81aed031bdea714832cf515244f6eb223531
          julia --project=clrs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Compare one and two same-precision conversions
        run: |
          set -euxo pipefail
          mkdir -p results
          cp .github/workflows/kissing5-convert-order-audit.yml results/workflow.yml
          julia --project=clrs - <<'JULIA' > results/solve.log 2>&1
          include("clrs/examples/ThreePointBound.jl")
          using .ThreePointBound, ClusteredLowRankSolver

          const PREC = 192
          const COMMON = (
              prec=PREC,
              matmul_prec=PREC,
              preprocess=false,
              verbose=false,
              duality_gap_threshold=big"1e-80",
              dual_error_threshold=big"1e-80",
              primal_error_threshold=big"1e-80",
              omega_d=10^3,
              omega_p=10^3,
              step_length_threshold=big"1e-30",
          )

          function cmp_scalar(a,b)
              aa=BigFloat(a); bb=BigFloat(b); d=abs(aa-bb)
              (entries=1, nonzero=d==0 ? 0 : 1, maxdiff=d)
          end
          function cmp_matrix(A,B)
              @assert size(A)==size(B)
              entries=length(A); nonzero=0; maxdiff=BigFloat(0)
              for i in eachindex(A)
                  d=abs(BigFloat(A[i])-BigFloat(B[i]))
                  nonzero += d==0 ? 0 : 1
                  maxdiff=max(maxdiff,d)
              end
              (entries=entries, nonzero=nonzero, maxdiff=maxdiff)
          end
          function mergecmp(parts)
              (entries=sum(x.entries for x in parts),
               nonzero=sum(x.nonzero for x in parts),
               maxdiff=maximum([BigFloat(0); [x.maxdiff for x in parts]]))
          end
          function cmp_coeff(A,B)
              @assert typeof(A)==typeof(B)
              if hasproperty(A,:lambda) && hasproperty(A,:vs) && hasproperty(A,:ws)
                  @assert length(A.lambda)==length(B.lambda)
                  parts=Any[]
                  for i in eachindex(A.lambda)
                      push!(parts,cmp_scalar(A.lambda[i],B.lambda[i]))
                      push!(parts,cmp_matrix(A.vs[i],B.vs[i]))
                      push!(parts,cmp_matrix(A.ws[i],B.ws[i]))
                  end
                  return mergecmp(parts)
              else
                  return cmp_matrix(A,B)
              end
          end

          function main()
              problem,_,_=three_point_spherical_codes(5,1//2,14,14;COMMON...,maxiterations=0)
              s0=ClusteredLowRankSolver.ClusteredLowRankSDP(problem;prec=PREC)
              s1=ClusteredLowRankSolver.convert_to_prec(s0,PREC)
              s2=ClusteredLowRankSolver.convert_to_prec(s1,PREC)

              parts=Any[]
              dicts=0
              key_sequence_mismatches=0
              first_key_mismatch=nothing
              type_mismatches=0
              for j in eachindex(s1.A), l in eachindex(s1.A[j]), r in axes(s1.A[j][l],1), s in axes(s1.A[j][l],2)
                  d1=s1.A[j][l][r,s]; d2=s2.A[j][l][r,s]
                  k1=collect(keys(d1)); k2=collect(keys(d2)); dicts+=1
                  if k1 != k2
                      key_sequence_mismatches+=1
                      isnothing(first_key_mismatch) && (first_key_mismatch=(j,l,r,s,k1,k2))
                  end
                  @assert Set(k1)==Set(k2)
                  for p in sort(k1)
                      type_mismatches += typeof(d1[p])==typeof(d2[p]) ? 0 : 1
                      push!(parts,cmp_coeff(d1[p],d2[p]))
                  end
              end
              for j in eachindex(s1.B); push!(parts,cmp_matrix(s1.B[j],s2.B[j])); end
              for j in eachindex(s1.c); push!(parts,cmp_matrix(s1.c[j],s2.c[j])); end
              for j in eachindex(s1.C.blocks), l in eachindex(s1.C.blocks[j].blocks)
                  push!(parts,cmp_matrix(s1.C.blocks[j].blocks[l],s2.C.blocks[j].blocks[l]))
              end
              push!(parts,cmp_matrix(s1.b,s2.b))
              push!(parts,cmp_scalar(s1.constant,s2.constant))
              total=mergecmp(parts)

              metadata_equal=(s1.maximize==s2.maximize &&
                  s1.matrix_coeff_names==s2.matrix_coeff_names &&
                  s1.free_coeff_names==s2.free_coeff_names &&
                  s1.matrix_coeff_blocks==s2.matrix_coeff_blocks &&
                  s1.order_c==s2.order_c)
              t1=ClusteredLowRankSolver.ThreadingInfo(s1)
              t2=ClusteredLowRankSolver.ThreadingInfo(s2)
              threading_equal=(t1.j_order==t2.j_order && t1.jl_order==t2.jl_order)

              open("results/summary.tsv","w") do io
                  println(io,"status\tPASS")
                  println(io,"solver_commit\t09ac81aed031bdea714832cf515244f6eb223531")
                  println(io,"precision\t",PREC)
                  println(io,"numeric_entries\t",total.entries)
                  println(io,"numeric_nonzero\t",total.nonzero)
                  println(io,"numeric_maxdiff\t",total.maxdiff)
                  println(io,"dicts\t",dicts)
                  println(io,"key_sequence_mismatches\t",key_sequence_mismatches)
                  println(io,"first_key_mismatch\t",repr(first_key_mismatch))
                  println(io,"type_mismatches\t",type_mismatches)
                  println(io,"metadata_equal\t",metadata_equal)
                  println(io,"threading_equal\t",threading_equal)
              end
              println("CONVERT_ORDER_AUDIT_COMPLETE")
          end
          main()
          JULIA
          grep -q CONVERT_ORDER_AUDIT_COMPLETE results/solve.log
          sha256sum results/* > results/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kissing5-convert-order-audit
          path: results/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9
