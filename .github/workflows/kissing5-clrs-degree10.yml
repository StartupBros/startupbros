name: kissing5-clrs-degree10

on:
  push:
    branches:
      - kissing5-relay-20260814
    paths:
      - .github/workflows/kissing5-clrs-degree10.yml
  workflow_dispatch:

jobs:
  clrs-degree10:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'
      - name: Clone and instantiate ClusteredLowRankSolver
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/nanleij/ClusteredLowRankSolver.jl.git clrs
          julia --project=clrs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Solve symmetry-reduced degree-10 model
        id: solve
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p results
          timeout 35m /usr/bin/time -v julia --project=clrs -e '
            include("clrs/examples/ThreePointBound.jl")
            using .ThreePointBound, ClusteredLowRankSolver
            problem, dualsol, primalsol = three_point_spherical_codes(
              5, 1//2, 10, 10;
              prec=256,
              duality_gap_threshold=1e-12,
              omega_d=10^3,
              omega_p=10^3)
            p = objvalue(problem, primalsol)
            d = dualobjvalue(problem, dualsol)
            println("CLRS_PRIMAL_OBJECTIVE=", p)
            println("CLRS_DUAL_OBJECTIVE=", d)
            println("CLRS_ABSOLUTE_GAP=", abs(p-d))
          ' 2>&1 | tee results/clrs_degree10.log
      - name: Parse output
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('results/clrs_degree10.log').read_text() if Path('results/clrs_degree10.log').exists() else ''
          out={}
          for key in ['PRIMAL_OBJECTIVE','DUAL_OBJECTIVE','ABSOLUTE_GAP']:
              m=re.findall(r'CLRS_'+key+r'=([^\s]+)',s)
              if m: out[key.lower()]=m[-1]
          out['status']='FINITE_PAIR' if 'primal_objective' in out and 'dual_objective' in out else 'NO_FINITE_PAIR'
          Path('results/clrs_degree10.json').write_text(json.dumps(out,indent=2,sort_keys=True)); print(json.dumps(out,indent=2))
          PY
          sha256sum results/* > results/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kissing5-clrs-degree10
          path: results/
          if-no-files-found: error
          retention-days: 30
