name: perfect-cuboid-six-factor-screen
on:
  push:
    branches: [math/perfect-cuboid-22-1-square-quotient]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Submit exact Magma six-factor screen
        run: |
          set -euo pipefail
          mkdir -p results
          cat > /tmp/screen.py <<'PY'
          import html, re, requests, sys
          code = r'''
          function Curves(M,N)
            a:=M^2-N^2; b:=2*M*N; q:=a^2*b^2;
            return [
              EllipticCurve([0,a^2-b^2,0,-q,0]),
              EllipticCurve([0,b^2-a^2,0,-q,0]),
              EllipticCurve([0,a^4+b^4,0,a^4*b^4,0]),
              EllipticCurve([0,a^2+b^2,0,q,0]),
              EllipticCurve([0,-a^2-b^2,0,q,0]),
              EllipticCurve([0,30*a*b+5*(a+b)^2,0,200*q+150*a*b*(a+b)^2,1000*q*(a+b)^2])
            ];
          end function;
          found:=false;
          for M in [22..36] do
            for N in [1..M-1] do
              if GCD(M,N) eq 1 and IsOdd(M-N) and not (M eq 22 and N eq 1) then
                V:=[]; kill:=0; amb:=false;
                C:=Curves(M,N);
                for i in [1..6] do
                  l,u:=RankBounds(C[i]); Append(~V,<l,u>);
                  if u eq 0 then kill:=i; break; end if;
                  if l eq 0 then amb:=true; end if;
                end for;
                if kill ne 0 then
                  print "KILL",M,N,kill,V;
                elif #V eq 6 and not amb then
                  print "SURV",M,N,V;
                  found:=true; break;
                else
                  print "AMBIG",M,N,V;
                end if;
              end if;
            end for;
            if found then break; end if;
          end for;
          '''
          r = requests.post('https://magma.maths.usyd.edu.au/xml/calculator.xml', data={'input': code}, timeout=90)
          r.raise_for_status()
          open('results/raw.xml','w').write(r.text)
          if '<offline>' in r.text or '<warning>' in r.text:
              print(r.text)
              raise SystemExit('Magma calculator offline/warning')
          lines = [html.unescape(x) for x in re.findall(r'<line>(.*?)</line>', r.text, flags=re.S)]
          out='\n'.join(lines).strip()+'\n'
          open('results/output.txt','w').write(out)
          print(out)
          if 'Runtime error' in out or '>>' in out:
              raise SystemExit('Magma error')
          if not any(line.startswith('SURV') for line in lines):
              raise SystemExit('No survivor found through M=36')
          PY
          python3 /tmp/screen.py
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-cuboid-six-factor-screen
          path: results/
          if-no-files-found: error
