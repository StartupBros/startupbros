name: perfect-cuboid-25-4-independent-rank0

on:
  push:
    branches: [math/perfect-cuboid-23-22-two-cover]
    paths: [.github/workflows/perfect-cuboid-25-4-independent-rank0.yml]
  workflow_dispatch:

jobs:
  rank:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: base
            model: 0,-8980810,0,4220579904025,0
          - label: twist6090
            model: 0,54693132900,0,156533289538469602500,0
    steps:
      - uses: actions/checkout@v4
      - name: Install eclib and PARI
        run: |
          sudo apt-get update
          sudo apt-get install -y eclib-tools pari-gp pari-elldata
      - name: Independent exact descents
        env:
          MODEL: ${{ matrix.model }}
        run: |
          set -euo pipefail
          mkdir -p results
          echo "[$MODEL]" | mwrank -v 1 -p 100 > results/mwrank.txt 2>&1
          cat results/mwrank.txt
          grep -q 'rank(E) = 0' results/mwrank.txt
          grep -q 'full Mordell-Weil basis have been determined unconditionally' results/mwrank.txt
          cat > /tmp/r.gp <<GP
          E=ellinit([$MODEL]); print("MODEL=",E[1..5]); print("RANK=",ellrank(E)); print("TORSION=",elltors(E)); print("ROOTNO=",ellrootno(E)); quit;
          GP
          GP_COLORS='' gp -q -s 500000000 /tmp/r.gp > results/pari.txt 2>&1
          cat results/pari.txt
          grep -q 'RANK=\[0, 0' results/pari.txt
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-cuboid-25-4-rank0-${{ matrix.label }}
          path: results/
          if-no-files-found: error
