name: perfect-cuboid-six-factor-matrix
on:
  push:
    branches: [math/perfect-cuboid-six-factor-matrix]
permissions:
  contents: read
jobs:
  screen:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        M: [22,23,24,25,26,27,28,29,30]
    steps:
      - uses: actions/checkout@v4
      - name: Submit exact Magma screen for fixed M
        env:
          MM: ${{ matrix.M }}
        run: |
          set -euo pipefail
          mkdir -p results
          cat > /tmp/screen.py <<'PY'
          import html, os, re, requests
          M=int(os.environ['MM'])
          code=f'''
          function C(M,N,i)
            a:=M^2-N^2; b:=2*M*N; q:=a^2*b^2;
            if i eq 1 then return EllipticCurve([0,a^2-b^2,0,-q,0]);
            elif i eq 2 then return EllipticCurve([0,b^2-a^2,0,-q,0]);
            elif i eq 3 then return EllipticCurve([0,a^4+b^4,0,a^4*b^4,0]);
            elif i eq 4 then return EllipticCurve([0,a^2+b^2,0,q,0]);
            elif i eq 5 then return EllipticCurve([0,-a^2-b^2,0,q,0]);
            else return EllipticCurve([0,30*a*b+5*(a+b)^2,0,200*q+150*a*b*(a+b)^2,1000*q*(a+b)^2]);
            end if;
          end function;
          M:={M};
          for N in [1..M-1] do
            if GCD(M,N) eq 1 and IsOdd(M-N) and not (M eq 22 and N eq 1) then
              V:=[]; kill:=0; amb:=false;
              for i in [1..6] do
                l,u:=RankBounds(C(M,N,i)); Append(~V,<l,u>);
                if u eq 0 then kill:=i; break; end if;
                if l eq 0 then amb:=true; end if;
              end for;
              if kill ne 0 then print "KILL",M,N,kill,V;
              elif #V eq 6 and not amb then print "SURV",M,N,V;
              else print "AMBIG",M,N,V; end if;
            end if;
          end for;
          '''
          r=requests.post('https://magma.maths.usyd.edu.au/xml/calculator.xml',data={'input':code},timeout=90)
          r.raise_for_status()
          open('results/raw.xml','w').write(r.text)
          if '<offline>' in r.text or '<warning>' in r.text:
              print(r.text); raise SystemExit('calculator unavailable')
          lines=[html.unescape(x) for x in re.findall(r'<line>(.*?)</line>',r.text,flags=re.S)]
          out='\n'.join(lines).strip()+'\n'
          open('results/output.txt','w').write(out)
          print(out)
          if 'Runtime error' in out or '>>' in out: raise SystemExit('Magma error')
          PY
          python3 /tmp/screen.py
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: six-factor-M-${{ matrix.M }}
          path: results/
          if-no-files-found: error
