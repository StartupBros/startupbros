name: kissing5-clrs-degree14

on:
  push:
    branches:
      - kissing5-relay-20260814
    paths:
      - .github/workflows/kissing5-clrs-degree14.yml
  workflow_dispatch:

jobs:
  clrs-degree14:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'

      - name: Clone and instantiate ClusteredLowRankSolver
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/nanleij/ClusteredLowRankSolver.jl.git clrs
          git -C clrs rev-parse HEAD | tee clrs_commit.txt
          julia --project=clrs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Solve degree-14 model at 192 bits
        run: |
          set +e
          mkdir -p results
          timeout 300m /usr/bin/time -v julia --project=clrs -e '
            using Serialization
            include("clrs/examples/ThreePointBound.jl")
            using .ThreePointBound, ClusteredLowRankSolver
            problem, dualsol, primalsol = three_point_spherical_codes(
              5, 1//2, 14, 14;
              prec=192,
              duality_gap_threshold=1e-8,
              omega_d=10^3,
              omega_p=10^3)
            p = objvalue(problem, primalsol)
            d = dualobjvalue(problem, dualsol)
            println("CLRS14_PRIMAL_OBJECTIVE=", p)
            println("CLRS14_DUAL_OBJECTIVE=", d)
            println("CLRS14_ABSOLUTE_GAP=", abs(p-d))
            println("DUALSOL_TYPE=", typeof(dualsol))
            println("PRIMALSOL_TYPE=", typeof(primalsol))
            println("DUALSOL_FIELDS=", fieldnames(typeof(dualsol)))
            println("PRIMALSOL_FIELDS=", fieldnames(typeof(primalsol)))
            serialize("results/degree14_solution.jls", (problem, dualsol, primalsol))
          ' 2>&1 | tee results/clrs_degree14.log
          status=${PIPESTATUS[0]}
          echo "$status" > results/julia_exit_status.txt
          cp clrs_commit.txt results/
          exit 0

      - name: Parse output
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,hashlib
          s=Path('results/clrs_degree14.log').read_text()
          out={}
          for key in ['PRIMAL_OBJECTIVE','DUAL_OBJECTIVE','ABSOLUTE_GAP']:
              m=re.findall(r'CLRS14_'+key+r'=([^\s]+)',s)
              if m: out[key.lower()]=m[-1]
          out['optimal_marker']='Optimal solution found' in s
          out['exit_status']=int(Path('results/julia_exit_status.txt').read_text())
          if Path('results/degree14_solution.jls').exists():
              out['solution_sha256']=hashlib.sha256(Path('results/degree14_solution.jls').read_bytes()).hexdigest()
              out['solution_size']=Path('results/degree14_solution.jls').stat().st_size
          out['status']='FINITE_PAIR' if 'primal_objective' in out and 'dual_objective' in out else 'NO_FINITE_PAIR'
          Path('results/clrs_degree14.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          sha256sum results/* > results/SHA256SUMS.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: kissing5-clrs-degree14
          path: results/
          if-no-files-found: error
          retention-days: 30
