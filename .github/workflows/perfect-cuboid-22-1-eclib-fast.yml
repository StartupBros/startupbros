name: perfect-cuboid-22-1-eclib-fast
on:
  push:
    branches: [math/perfect-cuboid-22-1-square-quotient]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install eclib
        run: |
          sudo apt-get update
          sudo apt-get install -y eclib-tools
      - name: Exact full descent
        run: |
          set -euo pipefail
          mkdir -p results
          echo '[0,2026205,0,975674007000,125435609638416000]' | mwrank -v 2 -p 100 > results/mwrank.txt 2>&1
          cat results/mwrank.txt
          ! grep -Eq 'syntax error|Segmentation|Aborted' results/mwrank.txt
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: perfect-cuboid-22-1-eclib-fast
          path: results/
          if-no-files-found: error
