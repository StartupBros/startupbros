name: perfect-cuboid-d161-torsor-points
on:
  push:
    branches: [math/perfect-cuboid-d161-torsor-points]
permissions:
  contents: read
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact tools
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp pari-seadata
      - name: Exact PARI rational-point search
        run: |
          set -euo pipefail
          mkdir -p results
          cat > /tmp/run.gp <<'GP'
          F=(x^2+23040000)*(161*x^2+1670420*x+3709440000);
          print("F=",expand(F));
          for(i=3,8,
            H=10^i;
            P=hyperellratpoints(F,H);
            print("BOUND=",H," POINTS=",P)
          );
          quit;
          GP
          GP_COLORS='' gp -q /tmp/run.gp > results/pari.txt 2>&1
          cat results/pari.txt
          ! grep -Eq '^\s*\*\*|syntax error|incorrect type|at top-level|stack overflows' results/pari.txt
          grep -q '^BOUND=' results/pari.txt
      - name: Independent exact denominator search
        run: |
          set -euo pipefail
          python3 - <<'PY' > results/python_search.txt
          from math import gcd,isqrt
          A=23040000
          def is_square(n):
              if n<0:return False
              r=isqrt(n);return r*r==n
          found=[]
          # z=p/q, gcd(p,q)=1; q^4 F(p/q) must be a square integer.
          # Search projective height max(|p|,q)<=20000 with modular prefilters.
          H=20000
          residues={m:{(i*i)%m for i in range(m)} for m in (64,63,65,77,85,91)}
          for q in range(1,H+1):
              q2=q*q; q4=q2*q2
              # bounded p; symmetry is absent because of linear term.
              for p in range(-H,H+1):
                  if gcd(abs(p),q)!=1: continue
                  p2=p*p
                  n1=p2+A*q2
                  n2=161*p2+1670420*p*q+3709440000*q2
                  N=n1*n2
                  bad=False
                  for m,rs in residues.items():
                      if N % m not in rs:
                          bad=True;break
                  if bad: continue
                  if is_square(N):
                      found.append((p,q,isqrt(N)))
                      print('FOUND',p,q,isqrt(N))
          print('COUNT',len(found))
          PY
          cat results/python_search.txt
          sha256sum results/* > results/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: d161-torsor-points
          path: results/
          if-no-files-found: error
