name: kissing5-clrs-sampling-audit-degree28

on:
  push:
    branches:
      - kissing5-relay-20260814
    paths:
      - .github/workflows/kissing5-clrs-sampling-audit-degree28.yml
  workflow_dispatch:

jobs:
  corrected-sampling-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12.6'

      - name: Clone and instantiate fixed solver commit
        run: |
          set -euxo pipefail
          git clone https://github.com/nanleij/ClusteredLowRankSolver.jl.git clrs
          git -C clrs checkout 09ac81aed031bdea714832cf515244f6eb223531
          julia --project=clrs -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - name: Exact full degree-28 modular injectivity audit
        run: |
          set -euxo pipefail
          mkdir -p results
          cat > corrected_audit.jl <<'JULIA'
          using Random, Nemo, SHA
          using ClusteredLowRankSolver

          const N3 = 14
          const D = 2N3
          Random.seed!(1935)

          exponents = Tuple{Int,Int,Int}[]
          degrees = Int[]
          for deg in 0:D, k in 0:div(deg,3), j in 0:div(deg-3k,2)
              push!(exponents, (deg-3k-2j, j, k))
              push!(degrees, deg)
          end
          tmp = length(exponents)
          @assert tmp == 865

          cheb_points = [vcat(ClusteredLowRankSolver.sample_points_chebyshev(D+k, -1, 1)...) for k=0:2]
          candidates = [[cheb_points[1][i+1], cheb_points[2][j+1], cheb_points[3][k+1]]
                        for i=0:D for j=0:D+1 for k=0:D+2]
          chosen = sort(candidates[shuffle(1:length(candidates))[1:tmp]])
          sample_nums = [[floor(BigInt, 10^4*x) for x in s] for s in chosen]
          @assert length(unique(sample_nums)) == tmp

          open("results/sample_numerators_degree28.csv", "w") do io
              for s in sample_nums
                  println(io, join(s, ","))
              end
          end
          fingerprint_text = join([join(string.(s), ",") for s in sample_nums], ";")
          sample_sha256 = bytes2hex(sha256(fingerprint_text))

          function basis_value(F, nums, exp)
              invd = inv(F(10000))
              u, v, t = (F(nums[i]) * invd for i in 1:3)
              e1 = u + v + t
              e2 = u*v + v*t + u*t
              e3 = u*v*t
              a,b,c = exp
              return e1^a * e2^b * e3^c
          end

          function eval_matrix(F, samples)
              vals = elem_type(F)[]
              sizehint!(vals, tmp*tmp)
              for s in samples, e in exponents
                  push!(vals, basis_value(F, s, e))
              end
              matrix(F, tmp, tmp, vals)
          end

          p = 1000003
          F = GF(p)
          M = eval_matrix(F, sample_nums)
          r = rank(M)
          d = det(M)
          @assert r == tmp
          @assert !iszero(d)

          bad_samples = deepcopy(sample_nums)
          bad_samples[end] = copy(bad_samples[1])
          duplicate_sample_rank = rank(eval_matrix(F, bad_samples))
          @assert duplicate_sample_rank == tmp-1

          Mcol = deepcopy(M)
          for i in 1:tmp
              Mcol[i,tmp] = Mcol[i,1]
          end
          duplicate_column_rank = rank(Mcol)
          @assert duplicate_column_rank == tmp-1

          degree_hist = Dict(dg => count(==(dg), degrees) for dg in sort(unique(degrees)))
          hist_text = join(["\"$(dg)\":$(degree_hist[dg])" for dg in sort(collect(keys(degree_hist)))], ",")

          open("results/degree28_sampling_injectivity.json", "w") do io
              println(io, "{")
              println(io, "  \"status\": \"PASS\",")
              println(io, "  \"solver_commit\": \"09ac81aed031bdea714832cf515244f6eb223531\",")
              println(io, "  \"seed\": 1935,")
              println(io, "  \"sos_basis_degree\": 14,")
              println(io, "  \"sampled_product_degree\": 28,")
              println(io, "  \"basis_dimension\": $(tmp),")
              println(io, "  \"candidate_grid_size\": $(length(candidates)),")
              println(io, "  \"distinct_selected_samples\": $(length(unique(sample_nums))),")
              println(io, "  \"sample_numerator_sha256\": \"$(sample_sha256)\",")
              println(io, "  \"prime\": $(p),")
              println(io, "  \"rank\": $(r),")
              println(io, "  \"determinant_residue\": \"$(d)\",")
              println(io, "  \"duplicate_sample_rank\": $(duplicate_sample_rank),")
              println(io, "  \"duplicate_basis_column_rank\": $(duplicate_column_rank),")
              println(io, "  \"weighted_degree_histogram\": {$(hist_text)},")
              println(io, "  \"conclusion\": \"The actual 865-point sampled representation is injective on the full symmetric weighted-degree-at-most-28 product space.\"")
              println(io, "}")
          end
          println(read("results/degree28_sampling_injectivity.json", String))
          JULIA
          /usr/bin/time -v julia --project=clrs corrected_audit.jl 2>&1 | tee results/corrected_audit.log
          sha256sum results/* > results/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kissing5-clrs-sampling-audit-degree28
          path: results/
          if-no-files-found: error
          retention-days: 30
